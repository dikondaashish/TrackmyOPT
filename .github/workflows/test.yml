name: CI

on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: ['20.x']

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Use Python for priority ATS parser fixtures
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/api/requirements.job-board.txt

      - name: Install pinned ATS adapter runtime
        run: python -m pip install -r apps/api/requirements.job-board.txt

      - name: Priority ATS raw-payload fixtures
        run: python -m unittest discover -s scripts/job-board/tests -p 'test_*.py'

      - name: Job-board scheduler tests
        run: node --test scripts/operations/trigger-job-board-ingestion.test.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web run lint

      - name: Typecheck
        run: pnpm --filter web run typecheck

      - name: Unit tests
        run: pnpm --filter web run test

      - name: Build
        # The web app's Next build doubles as our end-to-end TS validation.
        run: pnpm --filter web run build
        env:
          # Build needs at least Supabase URLs to compile static metadata.
          NEXT_PUBLIC_SUPABASE_URL: 'https://ci-placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'ci-placeholder-anon-key'
          JWT_SIGNING_SECRET: 'ci-placeholder-must-be-at-least-32-chars-long'
          SUPABASE_SERVICE_ROLE_KEY: 'ci-placeholder-service-role-key'

      - name: Extension typecheck
        # esbuild strips types without checking them, so the extension build
        # alone cannot catch a type error. This step is the only TS gate here.
        run: pnpm --filter extension run typecheck

      - name: Extension tests
        run: pnpm --filter extension run test

      - name: Extension build
        run: pnpm --filter extension run build

      - name: API lint
        run: pnpm --filter api run lint

      - name: API unit tests
        run: pnpm --filter api exec jest --runInBand

      - name: API E2E
        run: pnpm --filter api exec jest --config ./test/jest-e2e.json --runInBand

      - name: API build
        run: pnpm --filter api run build

  e2e:
    name: Playwright E2E (manual / nightly)
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps
      - run: pnpm --filter web run test:e2e
