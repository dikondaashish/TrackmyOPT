name: Job Board Ingestion

on:
  # Manual and recovery runs only. The daily schedule (Mon–Fri 14:00 and
  # 21:00, Sat–Sun 21:00 America/New_York) is dispatched by the Vercel cron
  # /api/cron/job-board-ingestion-dispatch (apps/web/vercel.json): GitHub
  # scheduled runs on this repository fired 5–9 hours late, outside every
  # slot window. Use this workflow to supervise a scheduled run
  # (manual_run_id job-board-hour-<UTC hour>, optionally monitor_only) or to
  # dispatch a job-board-manual-* run. See docs/ops/ingestion-automation.md.
  workflow_dispatch:
    inputs:
      manual_run_id:
        description: 'Explicit ID: job-board-manual-<unique-token> or an existing job-board-hour-* run for recovery'
        required: true
        type: string
      monitor_only:
        description: 'Read-only supervision of an existing run; never dispatches'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: job-board-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Wake API, queue and supervise authorized sources
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Supervision (120 min) plus one optional failed-source recovery pass.
    timeout-minutes: 250

    steps:
      - uses: actions/checkout@v6

      - name: Verify scheduler configuration
        env:
          RENDER_API_URL: https://trackmyopt-api.onrender.com
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          SCHEDULER_RUN_ID: ${{ inputs.manual_run_id }}
          TRIGGER_ORIGIN: github_actions
        run: |
          test -n "$RENDER_API_URL" || { echo 'Missing RENDER_API_URL secret'; exit 1; }
          test -n "$API_SECRET_KEY" || { echo 'Missing API_SECRET_KEY secret'; exit 1; }
          case "$SCHEDULER_RUN_ID" in job-board-manual-*|job-board-hour-*) ;; *) echo 'Invalid supervised run ID'; exit 1;; esac

      - name: Wake Render and supervise ingestion to terminal audits
        env:
          RENDER_API_URL: https://trackmyopt-api.onrender.com
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          SCHEDULER_RUN_ID: ${{ inputs.manual_run_id }}
          TRIGGER_ORIGIN: github_actions
          MONITOR_ONLY: ${{ inputs.monitor_only }}
          # One targeted requeue of failed sources per run, when enabled.
          AUTO_RECOVER_FAILED: ${{ vars.JOB_BOARD_AUTO_RECOVER_FAILED == 'true' }}
        run: node scripts/operations/trigger-job-board-ingestion.mjs
