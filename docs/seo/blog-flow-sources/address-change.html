<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1200,height=600"><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script><style>
*{box-sizing:border-box;margin:0}html,body{width:1200px;height:600px;overflow:hidden;background:#f5f2e9;color:#162c48;font-family:sans-serif}#root{width:100%;height:100%;padding:42px 48px;display:flex;flex-direction:column;gap:24px}.brand{font-size:19px;font-weight:700;letter-spacing:2px;color:#365675}h1{font-size:46px;line-height:1.12;letter-spacing:-1px}.steps{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{display:flex;align-items:center;gap:20px;border:3px solid #b9c9d8;border-radius:18px;background:#ffffff;padding:22px;min-height:118px}.number{flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;width:52px;height:52px;background:#162c48;color:white;font-size:27px;font-weight:700}h2{font-size:28px;line-height:1.15}p{font-size:21px;line-height:1.4;margin-top:7px;color:#365675}.footer{margin-top:auto;font-size:21px;line-height:1.35;font-weight:600;max-width:1060px}
</style></head><body><div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1200" data-height="600"><div class="brand">TRACKMYOPT · PROCESS GUIDE</div><h1>Moving with a pending case</h1><div class="steps"><div class="card" id="step-0"><span class="number">1</span><div><h2>Update USCIS</h2><p>Include relevant receipts</p></div></div><div class="card" id="step-1"><span class="number">2</span><div><h2>Tell your DSO</h2><p>Update student records</p></div></div><div class="card" id="step-2"><span class="number">3</span><div><h2>Save confirmations</h2><p>Keep dates and records</p></div></div><div class="card" id="step-3"><span class="number">4</span><div><h2>Check delivery</h2><p>Follow official instructions</p></div></div></div><p class="footer">USPS forwarding does not update USCIS or forward USCIS mail.</p></div><script>
const driver={time:0};const cards=[0,1,2,3].map(i=>document.getElementById('step-'+i));const tl=gsap.timeline({paused:true});tl.to(driver,{time:8,duration:8,ease:'none',onUpdate:()=>{const active=Math.min(3,Math.floor(driver.time/2));cards.forEach((card,i)=>{card.style.backgroundColor=i===active?'#dcecf9':'#ffffff';card.style.borderColor=i===active?'#1d5f9d':'#b9c9d8';});}},0);window.__timelines['main']=tl;
</script></body></html>
