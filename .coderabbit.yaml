# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit runs as a GitHub App on pull requests. Keep its review behavior
# versioned with the repository so it remains enabled after dashboard changes.
language: en-US

reviews:
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false

chat:
  auto_reply: true
