<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1c47"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Gavel motifs -->
  <g opacity="0.18" stroke="#ffffff" stroke-width="14" fill="none" stroke-linecap="round">
    <line x1="1000" y1="80" x2="1080" y2="160"/>
    <line x1="950" y1="220" x2="1130" y2="220"/>
    <line x1="1010" y1="250" x2="1010" y2="350"/>
  </g>

  <!-- Status chip -->
  <g transform="translate(80,90)">
    <rect width="200" height="46" rx="23" fill="#22c55e" fill-opacity="0.9"/>
    <text x="100" y="30" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">COURT UPDATE</text>
  </g>

  <text x="80" y="210" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    D/S Rule Blocked
  </text>
  <text x="80" y="288" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    <tspan fill="#7dd3fc">Duration of Status</tspan>
  </text>
  <text x="80" y="366" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    Stays  DHS Appeals
  </text>

  <text x="80" y="430" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" fill="#cbd5e1">
    September 2026 injunction + First Circuit appeal  what OPT students need to know right now
  </text>

  <!-- Bottom info card -->
  <g transform="translate(80,480)">
    <rect width="700" height="80" rx="12" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="24" y="32" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e0e7ff">8 min read · October 5, 2026 · Vinay Kumar</text>
    <text x="24" y="58" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">timeline · I-94 · OPT plan · travel · what to watch</text>
  </g>

  <!-- Logo -->
  <g transform="translate(1040,540)">
    <text x="80" y="30" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="end">track<tspan fill="#7dd3fc">my</tspan>opt</text>
  </g>
</svg>
