<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b0764"/>
      <stop offset="1" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#d8b4fe" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d8b4fe" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Lightning + fee motif -->
  <g opacity="0.28">
    <path d="M1040,110 L1000,200 L1030,200 L990,290" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1015" cy="200" r="90" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
    <text x="1015" y="350" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#fbbf24" letter-spacing="2" text-anchor="middle">$1,780 · 30 BD</text>
  </g>

  <g transform="translate(80,90)">
    <rect width="220" height="46" rx="23" fill="#a855f7" fill-opacity="0.95"/>
    <text x="110" y="30" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">FEE &amp; PROCESS GUIDE</text>
  </g>

  <text x="80" y="210" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    Premium Processing
  </text>
  <text x="80" y="286" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    for OPT &amp; STEM OPT:
  </text>
  <text x="80" y="362" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5">
