  </text>

  <g transform="translate(80,478)">
    <rect width="700" height="80" rx="12" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="24" y="32" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#fbbf24">9 min read · October 5, 2026 · Vinay Kumar</text>
    <text x="24" y="58" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#c4b5fd">Form I-907 · clock start · RFE pauses · when to skip it</text>
  </g>

  <g transform="translate(1040,540)">
    <text x="80" y="30" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="end">track<tspan fill="#fbbf24">my</tspan>opt</text>
  </g>
