<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Lottery strike motif -->
  <g opacity="0.22">
    <circle cx="1010" cy="180" r="80" fill="none" stroke="#ffffff" stroke-width="3"/>
    <line x1="957" y1="127" x2="1063" y2="233" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g transform="translate(80,90)">
    <rect width="200" height="46" rx="23" fill="#ef4444" fill-opacity="0.95"/>
    <text x="100" y="30" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">OFFICIAL: NO 2ND LOTTERY</text>
  </g>

  <text x="80" y="210" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    FY 2027 H-1B Cap:
  </text>
  <text x="80" y="284" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    <tspan fill="#fbbf24">Closed.</tspan> What OPT
  </text>
  <text x="80" y="358" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    Students Do Next
  </text>

  <text x="80" y="424" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" fill="#cbd5e1">
    July 17, 2026 USCIS notice · 5-step backup plan · cap-gap, cap-exempt, FY 2028 wage-weighted prep
  </text>

  <g transform="translate(80,474)">
    <rect width="700" height="80" rx="12" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="24" y="32" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#fde68a">9 min read · October 5, 2026 · Vinay Kumar</text>
    <text x="24" y="58" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">cap-gap ends Sept 30 · re-register in March</text>
  </g>

  <g transform="translate(1040,540)">
    <text x="80" y="30" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="end">track<tspan fill="#fbbf24">my</tspan>opt</text>
  </g>
</svg>
