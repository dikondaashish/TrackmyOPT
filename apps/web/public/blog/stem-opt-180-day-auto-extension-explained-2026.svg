<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#eae7db"/>
  <circle cx="1100" cy="80" r="180" fill="#3b82f6" fill-opacity="0.10"/>
  <circle cx="120" cy="560" r="220" fill="#3b82f6" fill-opacity="0.07"/>

  <g transform="translate(80,80)">
    <rect width="56" height="56" rx="14" fill="#1e3a8a"/>
    <path d="M18 28 L28 34 L40 20" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="158" y="118" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" fill="#0f172a">track<tspan fill="#3b82f6">my</tspan>opt</text>

  <g transform="translate(80,170)">
    <rect width="180" height="40" rx="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="90" y="26" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle" letter-spacing="1.5">WORK AUTH</text>
  </g>

  <text x="80" y="270" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" fill="#0f172a" letter-spacing="-1.5">STEM OPT 180-Day</text>
  <text x="80" y="338" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" fill="#1e3a8a" letter-spacing="-1.5">Auto-Extension:</text>
  <text x="80" y="406" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" fill="#0f172a" letter-spacing="-1.5">Starts &amp; Stops</text>

  <text x="80" y="462" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#475569">File Form I-765 on time and USCIS extends your work</text>
  <text x="80" y="490" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#475569">authorization up to 180 days while your case is pending.</text>

  <!-- 180 badge -->
  <g transform="translate(880,440)">
    <rect width="240" height="120" rx="16" fill="url(#cardGrad)"/>
    <text x="120" y="60" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="900" fill="#ffffff" text-anchor="middle">180</text>
    <text x="120" y="92" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#fde68a" text-anchor="middle" letter-spacing="2">DAYS AUTOMATIC</text>
  </g>

  <text x="80" y="594" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748b">8 min read  |  October 5, 2026  |  Vinay Kumar</text>
